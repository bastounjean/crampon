name: Ajouter des joueurs en activité
on:
  workflow_dispatch:
    inputs:
      count:
        description: Nombre de joueurs à ajouter
        default: '200'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/add-active.js ${{ inputs.count }}
      # sur une branche à part : la liste est relue avant d'aller sur le site
      - name: Enregistre la liste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b joueurs-actifs
          git add src/data/pool.json
          git commit -m "Ajoute des joueurs en activité depuis Wikidata"
          git push -f origin joueurs-actifs
