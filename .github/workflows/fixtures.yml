name: Pages Wikipédia de test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for t in "Zinédine_Zidane" "Kylian_Mbappé" "Ronaldo_(football,_1976)"; do
            curl -sSL -A "Crampon/1.0 (github.com/bastounjean/crampon)" "https://fr.wikipedia.org/api/rest_v1/page/html/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$t")" -o "$(echo $t | tr -dc 'A-Za-z_').html"
            curl -sSI "https://fr.wikipedia.org/api/rest_v1/page/html/Kylian_Mbapp%C3%A9" -H "Origin: https://example.com" | grep -i "access-control\|x-frame\|content-security" || true
          done
          ls -la
          git init -q -b fixtures && git add . && git -c user.name=bot -c user.email=bot@example.com commit -qm fixtures
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fixtures
